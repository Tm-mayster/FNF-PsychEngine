# This is a basic workflow to help you get started with Actions

name: Build


# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildLinux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id}}" -D officialBuild 2>&1 | tee build.log || { grep -A2 -E "ERROR" build.log | head -40 | sed "s/^/::error::/"; exit 1; }
      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'
  buildWindows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > /dev/null --quiet
          .\"setup/windows.bat"
        shell: cmd
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build windows --app-version="4.0.0-${{ github.run_id}}"  -D officialBuild 2>&1 | tee build.log || { grep -A2 -E "ERROR" build.log | head -40 | sed "s/^/::error::/"; exit 1; }
      - name: Make in-game update manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          root = 'export/release/windows/bin'
          files = []
          for d, _, fs in os.walk(root):
              for f in fs:
                  full = os.path.join(d, f)
                  rel = os.path.relpath(full, root).replace(os.sep, '/')
                  if rel == 'update.json' or rel.startswith('.git/'): continue
                  data = open(full, 'rb').read()
                  files.append({'p': rel, 'h': hashlib.sha1(data).hexdigest(), 's': len(data)})
          files.sort(key=lambda x: x['p'])
          json.dump({'build': int(os.environ['RUN_NUMBER']), 'files': files}, open(os.path.join(root, 'update.json'), 'w'))
          print(len(files), 'files')
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsBuild
          path: export/release/windows/bin
          compression-level: 9
      - name: Publish small update (exe only)
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsUpdate-exeOnly
          path: |
            export/release/windows/bin/*.exe
            export/release/windows/bin/manifest
            export/release/windows/bin/update.json
          compression-level: 9
      - name: Publish in-game update files (dist-windows branch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd export/release/windows/bin
          git init -q
          git config core.autocrlf false
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -q -b dist-windows
          git add -A
          git commit -qm "Windows build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist-windows
          rm -rf .git
  buildMac:
    runs-on: macos-15

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build mac --app-version="4.0.0-${{ github.run_id}}"  -D officialBuild
      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: macBuild
          path: export/release/macos/bin
